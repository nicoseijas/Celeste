name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. The job needs the checkout and nothing else, and a token that can write is a
# token a compromised dependency can write with.
permissions:
  contents: read

jobs:
  build:
    # WPF needs Windows: the library targets net8.0-windows and net10.0-windows,
    # and the tests run on a real WPF dispatcher.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # .editorconfig is the authority on style, and an authority nothing checks is a suggestion.
      # This catches the line endings and naming a build does not: IDE diagnostics are not compiler
      # diagnostics, so TreatWarningsAsErrors never sees them.
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack src/Celeste.Wpf/Celeste.Wpf.csproj --no-build --configuration Release --output artifacts

      # Packing proves a .nupkg came out of the build, not that anyone can use it. This restores it
      # into a project created outside the repository — so it inherits none of the build props — and
      # compiles XAML that resolves the library's own xmlns, on both target frameworks. net8.0-windows
      # is otherwise only compiled here, never consumed.
      - name: Validate the package from a clean consumer
        shell: pwsh
        run: ./eng/validate-package.ps1 -WorkingDirectory "${{ runner.temp }}/package-validation"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
